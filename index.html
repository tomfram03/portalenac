<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rede Wi-Fi Cativa</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 380px;
            padding: 20px;
            box-sizing: border-box;
        }
        .logos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .logo-placeholder {
            background: #f8f9fa;
            border: 1px dashed #ccc;
            padding: 10px 15px;
            border-radius: 4px;
            color: #6c757d;
            font-size: 14px;
            font-weight: bold;
        }
        .welcome-banner {
            background-color: #fff9e6;
            color: #e67e22;
            border-left: 4px solid #e67e22;
            padding: 12px 15px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 15px;
            border-radius: 0 4px 4px 0;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            text-align: left;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
        }
        .checkbox-group label {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        .checkbox-group a {
            color: #e67e22;
            text-decoration: underline;
        }
        .login-btn {
            background-color: #dcdcdc;
            color: #999;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .login-btn.active {
            background-color: #007bff;
            color: #ffffff;
            cursor: pointer;
        }
        .footer {
            margin-top: 25px;
            border-top: 1px solid #f0f0f0;
            padding-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #999;
            line-height: 1.6;
        }
        .footer a {
            color: #e67e22;
            text-decoration: none;
        }
        .logo-wifi {
            max-width: 70px;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logos">
            <!-- Logo genérico substituído -->
            <div class="logo-placeholder">LOGOTIPO EMPRESA</div>
            <img src="wifiZone.png" alt="Selo Wi-Fi Zone" class="logo-wifi">
        </div>

        <div class="welcome-banner">
            Boas-vindas à rede Wi-Fi de Visitantes!
        </div>

        <form>
            <div class="checkbox-group">
                <input type="checkbox" id="terms">
                <label for="terms">Aceito os <a href="#">Termos de uso.</a></label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="privacy">
                <label for="privacy">Li e aceito a <a href="#">Política de privacidade.</a></label>
            </div>

            <button type="button" class="login-btn" disabled>Efetuar login</button>
        </form>

        <div class="footer">
            Problemas para se autenticar?<br>
            <a href="#">Abra um chamado</a><br><br>
            IP: 192.168.50.16 | MAC: ae:a8:36:74:e2:f1
        </div>
    </div>
    <script>
        const terms = document.getElementById('terms');
        const privacy = document.getElementById('privacy');
        const loginBtn = document.querySelector('.login-btn');

        function checkForm() {
            if (terms.checked && privacy.checked) {
                loginBtn.removeAttribute('disabled');
                loginBtn.classList.add('active');
            } else {
                loginBtn.setAttribute('disabled', 'true');
                loginBtn.classList.remove('active');
            }
        }

        terms.addEventListener('change', checkForm);
        privacy.addEventListener('change', checkForm);

        loginBtn.addEventListener('click', function () {
            if (!loginBtn.hasAttribute('disabled')) {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
